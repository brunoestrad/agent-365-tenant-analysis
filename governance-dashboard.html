<style>

.upload-screen{min-height:100vh;display:grid;place-items:center;padding:28px}.upload-wrap{width:min(460px,100%);text-align:center;animation:rise .45s ease-out}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:99px;background:rgba(0,114,206,.11);border:1px solid rgba(0,114,206,.28);color:#55aef5;font:12px var(--mono);letter-spacing:.04em}.upload-title{font-size:clamp(44px,8vw,66px);line-height:.98;margin:24px 0 12px;font-weight:700;letter-spacing:-.05em}.upload-sub{font:13px var(--mono);color:var(--muted);margin-bottom:34px}.drop{border-radius:20px;padding:38px 26px;cursor:pointer;transition:.2s;outline:none}.drop:hover,.drop.drag{border-color:rgba(0,114,206,.55);box-shadow:0 0 50px rgba(0,114,206,.18);transform:translateY(-2px)}.upload-icon{width:66px;height:66px;margin:auto;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,rgba(0,114,206,.16),rgba(14,195,164,.09));border:1px solid rgba(0,114,206,.28);font-size:28px}.drop strong{display:block;margin:18px 0 6px}.fine{font:11px var(--mono);color:rgba(255,255,255,.28);line-height:1.6}.error{margin-top:14px;color:#ff7474;font:12px var(--mono)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:rgba(3,6,15,.91);backdrop-filter:blur(30px);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;z-index:5}.brand{padding:20px;border-bottom:1px solid rgba(255,255,255,.06)}.brand-row{display:flex;align-items:center;gap:10px}.brand-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 8px 25px rgba(0,114,206,.22);font-weight:700}.brand strong{font-size:14px}.brand small{display:block;color:var(--muted);font:10px var(--mono);margin:5px 0 0 42px}.file-card{margin:12px;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}.file-card span{display:block;font:10px var(--mono);color:var(--muted)}.file-card b{display:block;font:10px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.nav{padding:4px 12px;flex:1}.nav button,.reset{width:100%;border:0;background:transparent;border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;transition:.16s;color:rgba(255,255,255,.47);position:relative}.nav button:hover,.reset:hover{background:rgba(255,255,255,.045);color:#fff}.nav button.active{background:rgba(0,114,206,.15);color:#fff}.nav button.active:before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:2px;border-radius:3px;background:linear-gradient(var(--blue),var(--teal))}.nav .ico{width:18px;text-align:center}.badge{margin-left:auto;padding:2px 6px;border-radius:5px;background:rgba(0,114,206,.15);color:#55aef5;font:10px var(--mono)}.badge.danger{background:rgba(239,68,68,.14);color:#ff7474}.reset-wrap{padding:12px;border-top:1px solid rgba(255,255,255,.05)}.reset{font-size:12px}.content{height:100vh;overflow:auto}.page{width:min(1100px,100%);margin:auto;padding:26px;animation:fade .25s ease-out}.page.narrow{width:min(980px,100%)}
.page-head{margin-bottom:20px}.page-head h1{font-size:30px;letter-spacing:-.035em;margin:0 0 5px}.page-head p{font:12px var(--mono);color:var(--muted);margin:0}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar.split{justify-content:space-between}.search{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.search input{width:190px;background:transparent;border:0;outline:0;color:#fff;font:11px var(--mono)}.search input::placeholder{color:rgba(255,255,255,.25)}.btns{display:flex;gap:6px;flex-wrap:wrap}.chip-btn{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.36);padding:7px 10px;border-radius:8px;font:600 10px var(--mono);cursor:pointer;transition:.16s}.chip-btn:hover{color:#fff;border-color:rgba(255,255,255,.18)}.chip-btn.active{color:#68b9fa;background:rgba(0,114,206,.18);border-color:rgba(0,114,206,.4)}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px}.kpi{animation:rise .4s ease-out both;overflow:hidden}.kpi-top{display:flex;gap:8px;align-items:center;color:var(--muted);font:10px var(--mono);text-transform:uppercase;letter-spacing:.09em}.kpi-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px}.kpi-value{font-size:31px;line-height:1;font-weight:700;margin:13px 0 6px}.kpi-sub{font-size:11px;color:var(--muted)}.two{grid-template-columns:1fr 1fr}.section-title{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:0 0 18px}.progress-row{margin:0 0 14px}.progress-label{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.58);margin-bottom:6px}.progress-label b{font:600 11px var(--mono);color:rgba(255,255,255,.78)}.track{height:5px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px;animation:grow .7s ease-out both;transform-origin:left}.bar-chart{height:180px;display:flex;gap:11px;align-items:flex-end;padding:14px 4px 28px;border-bottom:1px solid rgba(255,255,255,.08)}.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:35px}.bar{width:min(48px,70%);min-height:2px;border-radius:6px 6px 0 0;box-shadow:0 0 18px rgba(34,211,238,.12);animation:growY .65s ease-out both;transform-origin:bottom}.bar-val{font:600 10px var(--mono);color:#fff;margin-bottom:5px}.bar-name{position:absolute;top:calc(100% + 8px);font:9px var(--mono);color:var(--muted);text-align:center;white-space:nowrap;max-width:95px;overflow:hidden;text-overflow:ellipsis}.stack{display:flex;flex-direction:column;gap:16px}
.list{display:flex;flex-direction:column;gap:8px}.agent{border-radius:13px;overflow:hidden;background:var(--panel);border:1px solid rgba(255,255,255,.075);border-left:2px solid var(--accent,#64748b);animation:rise .28s ease-out both}.agent-head{padding:14px 16px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.14s}.agent-head:hover{background:rgba(0,114,206,.06)}.agent-main{flex:1;min-width:0}.name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.agent-name{font-size:13px;font-weight:700}.agent-id{margin-top:4px;font:10px var(--mono);color:rgba(255,255,255,.27);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-meta{display:flex;gap:24px;align-items:center}.meta{text-align:right;min-width:90px}.meta span{display:block;font:9px var(--mono);color:var(--muted);margin-bottom:3px}.meta b{display:block;font-size:11px;max-width:135px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:17px;color:var(--muted);transition:.2s}.agent.open .chev{transform:rotate(90deg)}.details{display:none;padding:10px 16px 16px;border-top:1px solid rgba(255,255,255,.05)}.agent.open .details{display:block;animation:fade .2s ease-out}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.field{padding:10px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);min-width:0}.field label{display:block;font:9px var(--mono);color:var(--muted);margin-bottom:7px}.field .value{font-size:11px;color:#fff;word-break:break-word}.tag,.status{display:inline-block;padding:3px 7px;border-radius:5px;font:600 9px var(--mono);border:1px solid currentColor}.permissions{margin-top:9px;padding:11px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}.permissions-title{font:9px var(--mono);color:var(--muted);margin-bottom:8px}.perm{padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font:10px var(--mono);color:rgba(255,255,255,.62);word-break:break-all;margin-top:5px}.empty{text-align:center;padding:42px;border-radius:13px;color:var(--muted);font:11px var(--mono)}
.bp{margin-bottom:10px;border-left:2px solid var(--blue)}.bp-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.bp-name{font-size:14px;font-weight:700}.bp-id{font:10px var(--mono);color:var(--muted);margin-top:4px}.bp-stats{display:flex;gap:10px}.mini-stat{padding:9px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}.mini-stat span{display:block;font:9px var(--mono);color:var(--muted)}.mini-stat b{display:block;margin-top:3px}.bp-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.note{display:flex;gap:8px;color:rgba(255,120,120,.8);font:10px var(--mono);line-height:1.6;margin-top:12px}.classic{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.16);border-left-color:var(--red);box-shadow:0 0 22px rgba(239,68,68,.06)}.alert{display:flex;gap:10px;padding:14px;border-radius:12px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.19);font:10px/1.65 var(--mono);color:rgba(255,255,255,.44);margin-bottom:16px}
.guide-section{margin-bottom:16px}.guide-title{display:flex;gap:12px;align-items:center;margin-bottom:13px}.guide-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}.guide-title h2{font-size:16px;margin:0}.guide-title p{font:10px var(--mono);color:var(--muted);margin:3px 0 0}.guide-row{display:grid;grid-template-columns:140px 1fr;gap:14px;padding:11px 13px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);margin-top:7px}.guide-row b{font:600 10px var(--mono)}.guide-row span{font-size:11px;line-height:1.55;color:rgba(255,255,255,.48)}.rag-rule{padding:14px;border-radius:11px;border-left:3px solid;margin-top:10px}.rag-rule b{font:700 10px var(--mono)}.rag-rule ul{margin:9px 0 0;padding-left:17px;color:rgba(255,255,255,.45);font-size:11px;line-height:1.7}.scope{grid-template-columns:1fr 1fr}.scope h3{font:700 10px var(--mono);margin:0 0 9px}.scope ul{margin:0;padding-left:17px;color:rgba(255,255,255,.42);font-size:11px;line-height:1.75}.foot{font:9px var(--mono);color:rgba(255,255,255,.22);text-align:center;padding:15px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes grow{from{width:0}}@keyframes growY{from{transform:scaleY(0)}}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;height:auto;top:0;display:block;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:10px 14px}.brand small,.file-card,.reset-wrap{display:none}.nav{display:flex;overflow:auto;padding:7px}.nav button{min-width:max-content;width:auto;padding:9px}.nav button.active:before{left:20%;right:20%;top:auto;bottom:0;width:auto;height:2px}.content{height:auto;overflow:visible}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.page{padding:20px 14px}.detail-grid{grid-template-columns:repeat(2,1fr)}.head-meta{display:none}.scope{grid-template-columns:1fr}}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpi{padding:14px}.kpi-value{font-size:25px}.page-head h1{font-size:25px}.detail-grid{grid-template-columns:1fr}.guide-row{grid-template-columns:1fr}.bp-head{display:block}.bp-stats{margin-top:12px}.search{width:100%}.search input{width:100%}}
</style>

<body>
<div id="app" class="app"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const C={RED:'#ef4444',AMBER:'#f59e0b',GREEN:'#10b981'};
const S={data:null,page:'summary',search:'',filter:'ALL',sortField:'name',sortDir:'asc'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=v=>v===null||v===undefined||v===''?'—':esc(v);
function coerce(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='boolean'||typeof v==='number')return v;const s=String(v).trim(),l=s.toLowerCase();if(l==='true')return true;if(l==='false')return false;if(s!==''&&!isNaN(Number(s)))return Number(s);return s}
function norm(r){const o={};Object.keys(r).forEach(k=>o[k]=coerce(r[k]));return o}
function parse(buf){if(!window.XLSX)throw new Error('The Excel parser could not load. Connect to the internet and reopen this file.');const wb=XLSX.read(buf,{type:'array'}),o={};wb.SheetNames.forEach(n=>o[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:null}));return o}
function sortRows(a,key='AgentName'){return [...a].sort((x,y)=>{let av,bv;if(S.sortField==='name'){av=String(x[key]||'').toLowerCase();bv=String(y[key]||'').toLowerCase()}else{av=x.CreatedDate?new Date(x.CreatedDate).getTime():0;bv=y.CreatedDate?new Date(y.CreatedDate).getTime():0}return(av<bv?-1:av>bv?1:0)*(S.sortDir==='asc'?1:-1)})}
function rag(r){r=String(r||'').toUpperCase();return `<span class="tag" style="color:${C[r]||'#94a3b8'}">${r==='RED'?'●':r==='AMBER'?'●':r==='GREEN'?'●':''} ${esc(r||'—')}</span>`}
function status(v,t='Yes',f='No',mode='good'){const on=v===true||v==='true'||v===1,c=on?(mode==='danger'?C.RED:mode==='warn'?C.AMBER:C.GREEN):'rgba(255,255,255,.28)';return `<span class="status" style="color:${c};background:${c}14">${on?esc(t):esc(f)}</span>`}
function uri(missingUri,missingScope){if(!missingUri)return `<span class="status" style="color:${C.GREEN}">Has URI ✓</span>`;if(missingScope)return `<span class="status" style="color:rgba(255,255,255,.35)">No URI · client only</span>`;return `<span class="status" style="color:${C.AMBER}">No URI ⚠ (has scopes)</span>`}
function perms(p){if(!p)return '<span class="fine">None</span>';return String(p).split(/\r?\n|;\s*/).map(x=>x.trim()).filter(Boolean).map(x=>{const hi=x.includes('HIGH RISK'),u=x.includes('UNDECLARED'),c=hi?C.RED:u?C.AMBER:'rgba(255,255,255,.62)';return `<div class="perm" style="color:${c};border-color:${hi||u?c+'55':'rgba(255,255,255,.07)'}">${esc(x)}</div>`}).join('')}
function field(l,v){return `<div class="field"><label>${esc(l)}</label><div class="value">${v}</div></div>`}
function searchBox(ph='Search name…'){return `<label class="search"><span>⌕</span><input id="search" value="${esc(S.search)}" placeholder="${esc(ph)}" autocomplete="off"></label>`}
function sortButtons(){return `<div class="btns">${[['name','asc','A → Z'],['name','desc','Z → A'],['date','desc','Newest'],['date','asc','Oldest']].map(o=>`<button class="chip-btn sort ${S.sortField===o[0]&&S.sortDir===o[1]?'active':''}" data-f="${o[0]}" data-d="${o[1]}">${o[2]}</button>`).join('')}</div>`}
function head(title,sub){return `<div class="page-head"><h1>${title}</h1><p>${sub}</p></div>`}
function upload(){return `<main class="upload-screen"><section class="upload-wrap"><div class="eyebrow">◆ Microsoft Entra · IAM</div><h1 class="upload-title">Agent<br>Governance</h1><p class="upload-sub">Inspect your AI agent identity estate</p><div id="drop" class="drop glass" tabindex="0" role="button" aria-label="Upload governance Excel report"><div class="upload-icon">⇧</div><strong>Drop your governance report</strong><div class="fine">AgentGovernanceReport_YYYYMMDD_HHMM.xlsx<br>or click to select an .xlsx / .xls file</div><input id="file" type="file" accept=".xlsx,.xls" hidden></div><div id="err" class="error"></div></section></main>`}
function nav(){const d=S.data,total=d.modern.length+d.classic.length,items=[['overview','How to Read','?'],['summary','Summary','◉'],['all','All Agents','≡',total],['modern','Modern Agents','◆',d.modern.length],['blueprints','Blueprints','▱',d.blueprints.length],['classic','Classic Agents','▣',d.classic.length,d.classic.length>0]];return `<aside class="sidebar"><div class="brand"><div class="brand-row"><div class="brand-mark">A</div><strong>Agent Governance</strong></div><small>Entra IAM</small></div><div class="file-card"><span>Report File</span><b>${esc(d.fileName)}</b></div><nav class="nav">${items.map(i=>`<button data-page="${i[0]}" class="${S.page===i[0]?'active':''}"><span class="ico">${i[2]}</span><span>${i[1]}</span>${i[3]!==undefined?`<span class="badge ${i[4]?'danger':''}">${i[3]}</span>`:''}</button>`).join('')}</nav><div class="reset-wrap"><button class="reset" id="reset">↻ Load New Report</button></div></aside>`}
function guide(){const sections=[{i:'◆',c:'#0072ce',t:'Modern Agents',d:'Agents backed by Microsoft Entra Agent ID — the current governance standard.',rows:[['Identity','AgentName, AgentId, IsEnabled, CreatedDate. DaysSinceCreation flags newly created or long-stale agents.'],['Classification','IsModern, HasBlueprint, BlueprintIsExternal, BlueprintMultiTenant. Multi-tenant blueprints carry a wider trust surface.'],['Blueprint Health','BlueprintMissingUri, BlueprintMissingScope, BlueprintNoCredential. Configuration gaps on Company-owned blueprints only.'],['Credential Risk','HasClientSecret is high risk; HasCertificate is preferred. Review CredentialExpired, CredentialExpiringSoon and NearestCredentialExpiry.'],['Ownership','Owner = technical admin. Sponsor = business representative. OwnershipPattern: Both / Owner Only / Sponsor Only / Neither.'],['Activity','NeverSignedIn and IsInactive are placeholders until Reports.Read.All and the relevant Graph endpoint are enabled.'],['Platform Type','Copilot Studio agents use a shared Microsoft-managed blueprint. Owner assignment is recommended but optional for GREEN; a sponsor is still required.'],['Permissions','AgentPermissionCount and AgentPermissions show API permissions granted to the agent identity.']]},{i:'▱',c:'#22d3ee',t:'Blueprints',d:'App-registration equivalent for agents — holds credentials and configuration.',rows:[['Ownership','IsExternalBlueprint, PublisherDomain and IsMultiTenant describe the trust boundary.'],['Child Agents','ChildAgentCount and AgentNames. Zero children may indicate an unused blueprint.'],['Configuration','HasIdentifierUri and HasOAuthScope are relevant to delegated or OBO flows.'],['Credential','Certificate preferred; Secret Only is high risk; Secret + Certificate means remove the secret; None is broken.'],['Permissions','UNDECLARED means permission granted in Entra but missing from the blueprint manifest.']]},{i:'▣',c:'#f59e0b',t:'Classic Agents',d:'Pre-Agent ID service principals. No blueprint, no sponsor, and not Conditional Access-targetable.',rows:[['Platform','Copilot Studio, Foundry or Unknown — derived from service principal tags.'],['Ownership','Verify in the Enterprise Apps blade in Microsoft Entra admin center.'],['Action','Migrate to Agent ID. Treat these as a governance backlog, not automatically as ungoverned.']]}];const rules=[['RED',C.RED,['Agent is classic','Has a client secret','Has an expired credential','Has no sponsor','Never signed in and older than 30 days']],['AMBER',C.AMBER,['No owner and not a Copilot Studio agent','Credential expiring within 60 days','Agent is inactive','Missing identifier URI while exposing OAuth scopes','Blueprint has no credential']],['GREEN',C.GREEN,['None of the Red or Amber triggers apply']]];return `${head('How to Read This Dashboard',"Governance snapshot of AI agent identities in Microsoft Entra tenant.")}${sections.map(s=>`<section class="card guide-section"><div class="guide-title"><div class="guide-icon" style="color:${s.c};background:${s.c}18;border:1px solid ${s.c}44">${s.i}</div><div><h2>${s.t}</h2><p>${s.d}</p></div></div>${s.rows.map(r=>`<div class="guide-row"><b style="color:${s.c}">${r[0]}</b><span>${r[1]}</span></div>`).join('')}</section>`).join('')}<section class="card guide-section"><div class="guide-title"><div class="guide-icon" style="color:${C.RED};background:${C.RED}18">!</div><div><h2>RAG Rating Logic</h2></div></div>${rules.map(r=>`<div class="rag-rule" style="border-color:${r[1]};background:${r[1]}0d"><b style="color:${r[1]}">● ${r[0]}</b><ul>${r[2].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</section><section class="card"><p class="section-title" style="color:#22d3ee">Scope & Limitations</p><div class="grid scope"><div><h3 style="color:${C.GREEN}">✓ Covered</h3><ul><li>Modern Entra Agent ID identities</li><li>Classic SP-backed agents tagged AgenticInstance</li><li>Blueprint principals visible</li><li>Credential health for Company-owned blueprints</li></ul></div><div><h3 style="color:${C.RED}">✕ Not covered</h3><ul><li>Agent Builder agents</li><li>Third-party agents with non-standard tags</li><li>Shadow agents requiring network inspection</li><li>External blueprint credential health</li><li>Sign-in activity without Reports.Read.All</li></ul></div></div></section>`}
function kpi(label,n,color,sub,icon){return `<div class="card kpi"><div class="kpi-top"><span class="kpi-icon" style="color:${color};background:${color}18">${icon}</span>${label}</div><div class="kpi-value" style="color:${color}">${n}</div><div class="kpi-sub">${sub||''}</div></div>`}
function progress(label,n,total,color){const p=total?Math.round(n/total*100):0;return `<div class="progress-row"><div class="progress-label"><span>${label}</span><b>${n.toLocaleString()} <span style="color:var(--muted)">(${p}%)</span></b></div><div class="track"><div class="fill" style="width:${p}%;background:${color}"></div></div></div>`}
function barChart(rows,colors=['#22d3ee']){const max=Math.max(1,...rows.map(x=>x.count));return `<div class="bar-chart">${rows.map((x,i)=>`<div class="bar-col"><span class="bar-val">${x.count}</span><div class="bar" style="height:${Math.max(3,x.count/max*100)}%;background:${colors[i%colors.length]}"></div><span class="bar-name" title="${esc(x.name)}">${esc(x.name)}</span></div>`).join('')}</div>`}
function summary(){const {modern:m,blueprints:b,classic:c}=S.data,total=m.length+c.length,rc={RED:c.length,AMBER:0,GREEN:0};m.forEach(a=>{const r=String(a.RiskRating||'').toUpperCase();if(rc[r]!==undefined)rc[r]++});const n=q=>m.filter(q).length,nb=q=>b.filter(q).length,ext=nb(x=>x.IsExternalBlueprint===true),own={};m.forEach(a=>{const x=a.OwnershipPattern||'Unknown';own[x]=(own[x]||0)+1});const plat={};c.forEach(a=>{const x=a.Platform||'Unknown';plat[x]=(plat[x]||0)+1});const coverage=[['Green — Fully Governed',rc.GREEN,total,C.GREEN],['Has Certificate',n(a=>a.HasCertificate===true),m.length,C.cyan||'#22d3ee'],['Has Owner',n(a=>a.NoOwner===false),m.length,'#3b82f6'],['Has Sponsor',n(a=>a.NoSponsor===false),m.length,'#a78bfa'],['Credential Risk (Secret)',n(a=>a.HasClientSecret===true),m.length,C.RED],['Expired Credentials',n(a=>a.CredentialExpired===true),m.length,C.RED],['Expiring Soon (60d)',n(a=>a.CredentialExpiringSoon===true),m.length,C.AMBER],['No Owner',n(a=>a.NoOwner===true),m.length,C.AMBER],['Copilot Studio Agents',n(a=>a.IsCopilotStudioAgent===true),m.length,'#0ec3a4'],['Classic (Needs Migration)',c.length,total,'#fb923c'],['Blueprints w/ Undeclared Perms',nb(x=>String(x.GrantedPermissions||'').includes('UNDECLARED')),b.length,C.AMBER],['Blueprints w/ High-Risk Perms',nb(x=>x.HasHighRiskPermissions===true),b.length,C.RED]];return `${head('Governance Summary',`Point-in-time snapshot · ${total} agent identities`)}<div class="grid kpis">${kpi('Total Agents',total,'#e2e8f0','Modern + classic','◆')}${kpi('Green — Governed',rc.GREEN,C.GREEN,'Fully governed','✓')}${kpi('Amber — Review',rc.AMBER,C.AMBER,'Requires review','!')}${kpi('Red — At Risk',rc.RED,C.RED,'Requires action','×')}</div><div class="grid kpis">${kpi('Blueprints',b.length,'#22d3ee',`${b.length-ext} Company · ${ext} external`,'▱')}${kpi('Credential Risk',n(a=>a.HasClientSecret===true),C.RED,'agents with client secrets','⌁')}${kpi('No Sponsor',n(a=>a.NoSponsor===true),C.AMBER,'missing business owner','♙')}${kpi('Classic Agents',c.length,'#fb923c','pre-Agent ID; migrate','▣')}</div><div class="grid two"><section class="card"><p class="section-title">Coverage Breakdown</p>${coverage.map(x=>progress(...x)).join('')}</section><div class="stack"><section class="card"><p class="section-title">Ownership Pattern · Modern Agents</p>${barChart(Object.entries(own).map(([name,count])=>({name,count})))}</section>${c.length?`<section class="card"><p class="section-title">Classic Agent Platforms</p>${barChart(Object.entries(plat).map(([name,count])=>({name,count})),['#22d3ee','#10b981','#f59e0b','#ef4444'])}</section>`:''}</div></div>`}
function modernDetails(a){const fs=[['Enabled',status(a.IsEnabled)],['Created',val(a.CreatedDate)],['Days Old',val(a.DaysSinceCreation)],['Sign-In Audience',val(a.SignInAudience)],['Certificate',status(a.HasCertificate,'Yes ✓','No')],['Client Secret',status(a.HasClientSecret,'Yes ⚠','No','danger')],['Cred Expired',status(a.CredentialExpired,'Expired ✗','Valid','danger')],['Expiring Soon',status(a.CredentialExpiringSoon,'Yes ⚠','No','warn')],['Nearest Expiry',val(a.NearestCredentialExpiry)],['Owner Count',val(a.OwnerCount)],['Owners',val(a.Owners)],['Sponsor Count',val(a.SponsorCount)],['Sponsors',val(a.Sponsors)],['Disabled Owner',status(a.HasDisabledOwner,'Yes ⚠','No','warn')],['Blueprint URI',uri(a.BlueprintMissingUri,a.BlueprintMissingScope)],['No Blueprint Cred',status(a.BlueprintNoCredential,'Missing ⚠','OK','warn')],['Permission Count',val(a.AgentPermissionCount??0)]];return `<div class="detail-grid">${fs.map(x=>field(x[0],x[1])).join('')}</div>${a.AgentPermissions?`<div class="permissions"><div class="permissions-title">Granted Permissions</div>${perms(a.AgentPermissions)}</div>`:''}`}
function classicDetails(a){return `<div class="detail-grid">${field('App ID',val(a.AgentAppId))}${field('Enabled',status(a.IsEnabled))}${field('Days Old',val(a.DaysSinceCreation))}</div>${a.Notes?`<div class="note">→ ${esc(a.Notes)}</div>`:''}`}
function agentCard(a,i,type){const modern=type==='modern',r=modern?String(a.RiskRating||'').toUpperCase():'RED',tags=[`<span class="tag" style="color:${modern?'#60a5fa':C.RED}">${modern?'Modern':'Classic'}</span>`,rag(r)];if(modern&&a.IsCopilotStudioAgent===true)tags.push('<span class="tag" style="color:#0ec3a4">Copilot Studio</span>');if(modern&&a.BlueprintIsExternal===true)tags.push('<span class="tag" style="color:#22d3ee">External</span>');if(!modern&&a.Platform)tags.push(`<span class="tag" style="color:#60a5fa">${esc(a.Platform)}</span>`);return `<article class="agent" style="--accent:${C[r]||'#64748b'};animation-delay:${Math.min(i*.02,.2)}s"><div class="agent-head"><div class="agent-main"><div class="name-row"><span class="agent-name">${val(a.AgentName)}</span>${tags.join('')}</div><div class="agent-id">${val(a.AgentId)}</div></div><div class="head-meta"><div class="meta"><span>${modern?'Ownership':'Created'}</span><b>${modern?val(a.OwnershipPattern):val(a.CreatedDate)}</b></div><div class="meta"><span>${modern?'Blueprint':'Platform'}</span><b>${modern?val(a.BlueprintName):val(a.Platform)}</b></div><span class="chev">›</span></div></div><div class="details">${modern?modernDetails(a):classicDetails(a)}</div></article>`}
function allAgents(){let a=[...S.data.modern.map(x=>({...x,_type:'modern'})),...S.data.classic.map(x=>({...x,_type:'classic'}))];if(S.search)a=a.filter(x=>String(x.AgentName||'').toLowerCase().includes(S.search.toLowerCase()));a=sortRows(a);return `${head('All Agents',`${a.length} of ${S.data.modern.length+S.data.classic.length} · ${S.data.modern.length} modern · ${S.data.classic.length} classic`)}<div class="toolbar">${searchBox('Search agent name…')}${sortButtons()}</div><div class="list">${a.length?a.map((x,i)=>agentCard(x,i,x._type)).join(''):'<div class="glass empty">No agents match your search.</div>'}</div>`}
function modernPage(){let a=S.data.modern;if(S.filter!=='ALL')a=a.filter(x=>String(x.RiskRating||'').toUpperCase()===S.filter);if(S.search)a=a.filter(x=>String(x.AgentName||'').toLowerCase().includes(S.search.toLowerCase()));a=sortRows(a);return `${head('Modern Agents',`${a.length} of ${S.data.modern.length} agents`)}<div class="toolbar split"><div>${searchBox('Search name…')}</div><div class="btns">${['ALL','RED','AMBER','GREEN'].map(f=>`<button class="chip-btn filter ${S.filter===f?'active':''}" data-filter="${f}" style="${S.filter===f?`color:${f==='ALL'?'#60a5fa':C[f]};border-color:${f==='ALL'?'#0072ce':C[f]}`:''}">${f}</button>`).join('')}</div></div><div class="toolbar">${sortButtons()}</div><div class="list">${a.length?a.map((x,i)=>agentCard(x,i,'modern')).join(''):'<div class="glass empty">No agents match your filter.</div>'}</div>`}
function blueprintCard(b,i){const ext=b.IsExternalBlueprint===true,ct=String(b.CredentialType||''),cc=ct.includes('Certificate')&&!ct.includes('Secret')?C.GREEN:ct.includes('BROKEN')||ct.startsWith('None')?C.RED:C.AMBER;return `<article class="card bp" style="border-left-color:${ext?'#22d3ee':'#0072ce'};animation:rise .3s ease-out ${Math.min(i*.04,.24)}s both"><div class="bp-head"><div><div class="name-row"><span class="bp-name">${val(b.BlueprintName)}</span>${ext?'<span class="tag" style="color:#22d3ee">External</span>':''}${b.IsMultiTenant===true?'<span class="tag" style="color:#f59e0b">Multi-Tenant</span>':''}</div><div class="bp-id">${val(b.BlueprintAppId)}</div>${b.PublisherDomain?`<div class="bp-id">Publisher: ${esc(b.PublisherDomain)}</div>`:''}</div><div class="bp-stats"><div class="mini-stat"><span>Child Agents</span><b>${val(b.ChildAgentCount)}</b></div>${b.CredentialType?`<div class="mini-stat"><span>Credential</span><b style="color:${cc};font:600 10px var(--mono)">${esc(b.CredentialType)}</b></div>`:''}</div></div>${b.AgentNames?`<div class="bp-id" style="margin-top:12px"><span style="color:#55aef5">Agents · </span>${esc(b.AgentNames)}</div>`:''}<div class="bp-chips">${uri(!b.HasIdentifierUri,!b.HasOAuthScope)}${status(b.HasOAuthScope,'Has Scope ✓','No Scope')}${status(b.HasCertificate,'Certificate ✓','No Certificate')}${status(b.HasClientSecret,'Secret ⚠','No Secret','danger')}${b.HasHighRiskPermissions!==null&&b.HasHighRiskPermissions!==undefined?status(b.HasHighRiskPermissions,'High-Risk Perms ⚠','No High-Risk Perms','danger'):''}</div>${b.GrantedPermissions||b.GrantedPermissionCount>0?`<div class="permissions"><div class="permissions-title">Granted Permissions · ${val(b.GrantedPermissionCount??0)} total</div>${perms(b.GrantedPermissions)}</div>`:''}</article>`}
function blueprints(){let a=S.data.blueprints;if(S.search)a=a.filter(x=>String(x.BlueprintName||'').toLowerCase().includes(S.search.toLowerCase()));a=sortRows(a,'BlueprintName');return `${head('Blueprints',`${a.length} of ${S.data.blueprints.length} blueprint principals`)}<div class="toolbar">${searchBox('Search blueprint name…')}${sortButtons()}</div>${a.length?a.map(blueprintCard).join(''):'<div class="glass empty">No blueprints match your search.</div>'}`}
function classic(){let a=S.data.classic;if(S.search)a=a.filter(x=>String(x.AgentName||'').toLowerCase().includes(S.search.toLowerCase()));a=sortRows(a);return `${head(`Classic Agents <span style="color:${C.RED}">(${S.data.classic.length})</span>`,'Pre-Agent ID service principals — all Red. Migration required.')}<div class="toolbar">${searchBox('Search agent name…')}${sortButtons()}</div><div class="alert"><span style="color:${C.RED}">!</span><span>No blueprint, no sponsor enforcement, and not targetable by Conditional Access. Migrate to Agent ID. Verify ownership via the Enterprise Apps blade in Microsoft Entra admin center.</span></div>${a.length?a.map((x,i)=>`<article class="card bp classic" style="animation:rise .3s ease-out ${Math.min(i*.04,.24)}s both"><div class="bp-head"><div><div class="name-row"><span class="bp-name">${val(x.AgentName)}</span>${rag('RED')}${x.Platform?`<span class="tag" style="color:#60a5fa">${esc(x.Platform)}</span>`:''}</div><div class="bp-id">${val(x.AgentId)}</div></div><div class="bp-stats"><div class="mini-stat"><span>Created</span><b class="mono" style="font-size:10px">${val(x.CreatedDate)}</b></div><div class="mini-stat"><span>Days Old</span><b>${val(x.DaysSinceCreation)}</b></div></div></div>${x.Notes?`<div class="note">→ ${esc(x.Notes)}</div>`:''}</article>`).join(''):'<div class="glass empty">No agents match your search.</div>'}`}
function pageHtml(){if(S.page==='overview')return guide();if(S.page==='summary')return summary();if(S.page==='all')return allAgents();if(S.page==='modern')return modernPage();if(S.page==='blueprints')return blueprints();return classic()}
function dashboard(){return `<div class="shell">${nav()}<main class="content"><div class="page ${S.page==='summary'?'narrow':''}">${pageHtml()}<div class="foot">Internal governance aid · Verify report results before taking remediation action.</div></div></main></div>`}
function render(){const app=$('#app');app.innerHTML=S.data?dashboard():upload();bind()}
function bind(){if(!S.data){const drop=$('#drop'),file=$('#file'),go=f=>load(f);drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');go(e.dataTransfer.files[0])};file.onchange=e=>go(e.target.files[0]);return}$$('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;S.search='';S.filter='ALL';render()});const reset=$('#reset');if(reset)reset.onclick=()=>{S.data=null;S.page='summary';S.search='';render()};const search=$('#search');if(search)search.oninput=e=>{S.search=e.target.value;const pos=e.target.selectionStart;render();const n=$('#search');if(n){n.focus();n.setSelectionRange(pos,pos)}};$$('.sort').forEach(b=>b.onclick=()=>{S.sortField=b.dataset.f;S.sortDir=b.dataset.d;render()});$$('.filter').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render()});$$('.agent-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'))}
async function load(file){if(!file)return;const err=$('#err');err.textContent='';try{const raw=parse(await file.arrayBuffer()),modern=(raw['Modern Agents']||[]).map(norm),blueprints=(raw['Blueprints']||[]).map(norm),classic=(raw['Classic Agents']||[]).map(norm);if(!modern.length&&!blueprints.length&&!classic.length)throw new Error('No recognised data found. Expected sheets: Modern Agents, Blueprints, or Classic Agents.');S.data={modern,blueprints,classic,fileName:file.name};render()}catch(e){err.textContent='Parse error: '+e.message}}
render();
</script>
</body>
</html>
